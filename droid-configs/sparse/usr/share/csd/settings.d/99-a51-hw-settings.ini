; Hardware features for the Samsung Galaxy A51 (a51).
;
; ssu-sysinfo globs /usr/share/csd/settings.d/*hw-settings*.ini and, for each
; feature, looks up a CSD key in the [features] section:
;
;     val = inifile_get(cfg, "features", hw_feature_to_csd_key(id), 0);
;     supported = (strtol(val, 0, 0) != 0);
;
; Two things about that are easy to get wrong, and both cost real time here:
; the keys are CSD names, not the Feature_* names ssu-sysinfo prints back
; (acceleration is "GSensor", compass is "ECompass", gyro is "Gyro"), and the
; value goes through strtol -- so "true" parses as 0 and silently disables the
; feature. Numbers only.
;
; Without this file every lookup falls back to unsupported, which is why
; sensorfwd refused to load any sensor plugin and why Settings hid the adaptive
; brightness toggle: it is conditional on Feature_LightSensor.

[features]

; --- verified working on this port --------------------------------------
LCD = 1
Backlight = 1
Touch = 1
Battery = 1
UsbCharging = 1
Key = 1
Vibrator = 1
Loudspeaker = 1
Receiver = 1
Headset = 1
AudioMic1 = 1
LightSensor = 1
GSensor = 1
Gyro = 1
ECompass = 1
BackCamera = 1
FrontCamera = 1
Wifi = 1
SIM = 1
CellularData = 1
CellularVoice = 1
CellInfo = 1
SDCard = 1
VideoPlayback = 1
UsbOtg = 1

; Bluetooth works as of the hci_sock.c restoration -- Samsung had gutted the
; kernel HCI socket layer, which panicked on the first AF_BLUETOOTH socket. With
; that restored, bluebinder bridges the Android HAL to vhci and BlueZ drives a
; real controller.
Bluetooth = 1
BluetoothTethering = 1

; --- deliberately off ---------------------------------------------------
; Hardware this device does not have, or the port does not support.
ProxSensor = 0
Fingerprint = 0
NFC = 1
FmRadio = 0
LED = 0
ButtonBacklight = 0
Hall = 0
TOH = 0
StereoLoudspeaker = 0
TouchAuto = 0
; GPS: the stack is all present and running -- Samsung's gpsd and
; vendor.samsung.hardware.gnss@2.0-service are alive, and the image already
; carries geoclue-provider-hybris-binder plus the location settings page. Only
; this flag was hiding it, which meant Settings offered no Location entry at all
; and csd's GPS self-test stayed unavailable.
GPS = 1
