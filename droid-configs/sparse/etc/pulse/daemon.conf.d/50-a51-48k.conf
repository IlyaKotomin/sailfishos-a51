; The Exynos ABOX DMA only clocks 48 kHz on this device. At 44.1 kHz the PCM
; hw_ptr never advances at all and every stream ends in a drain timeout, so pin
; both the default and the alternate rate -- PulseAudio will otherwise switch to
; 44.1 kHz on its own for content at that rate.
default-sample-rate = 48000
alternate-sample-rate = 48000
default-sample-format = s16le
default-sample-channels = 2
