# libhybris matches its search-path entries per directory, exactly: bionic's
# is_accessible() uses file_is_in_dir() for ld_library_paths, so the compiled-in
# default of ".../vendor/lib64" never authorises /vendor/lib64/hw/... . That is
# what refuses the gralloc mapper and libGLES_mali.so for namespace "(default)",
# which makes libui abort lipstick with "gralloc-mapper is missing".
# Name the subdirectories explicitly.
[Manager]
DefaultEnvironment=HYBRIS_LD_LIBRARY_PATH=/usr/libexec/droid-hybris/system/lib64:/system/lib64:/system/lib64/hw:/vendor/lib64:/vendor/lib64/hw:/vendor/lib64/egl:/odm/lib64:/odm/lib64/hw:/product/lib64:/apex/com.android.vndk.v33/lib64:/apex/com.android.runtime/lib64/bionic
