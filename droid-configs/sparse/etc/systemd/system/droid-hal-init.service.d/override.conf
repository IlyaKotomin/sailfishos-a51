[Service]
# Android init can only run once per boot: a restart re-enters first stage and
# aborts on the /dev/dm-user and /dev/kmsg_debug nodes the first run created,
# which destroys the HAL layer the first run brought up.
Restart=no
TimeoutSec=120

# Upstream runs this unit sandboxed, and each of these three settings puts it in
# a private mount namespace. That hides everything Android mounts from the rest
# of the system: /apex came up empty for every process outside the unit, and
# /linkerconfig/ld.config.txt did not exist there at all. lipstick is outside,
# so the vendor gralloc mapper could never resolve its VNDK dependencies from
# /apex/com.android.vndk.v33 -- which is what libui reports as
# "gralloc-mapper is missing" before aborting.
#
# Android's init is meant to own these mounts globally, so let it. selinuxfs no
# longer needs the namespace to stay hidden from systemd: /etc/selinux/config
# keeps libselinux from handing systemd a NULL to dereference.
PrivateTmp=false
ProtectSystem=no
ProtectHome=no
