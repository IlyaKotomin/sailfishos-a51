# Bluetooth is modular in this kernel, and bluebinder needs /dev/vhci -- which
# only exists once hci_vhci is loaded. Without this, bluebinder exits with
# "Failed to open /dev/vhci device" (errno 19), bluetoothd never activates, and
# every D-Bus caller that touches org.bluez blocks for the full 25 s activation
# timeout. PulseAudio does this at startup, and so does the UI, which is how a
# missing module turned into a startup wizard whose Next button "did nothing"
# for half a minute at a time.
bluetooth
hci_vhci
