; Samsung Galaxy A51 (a51) sensor availability.
;
; 20-sensors-default.conf resolves these through ssu-sysinfo hw-settings,
; which this port does not ship, so every Feature_* lookup comes back false
; and sensorfwd refuses to load the plugins even though the Android HAL
; enumerates the sensors. State them directly instead.
;
; HAL sensor list: LSM6DSL accelerometer + gyroscope, AK09918C magnetometer,
; TCS3701 light. There is no SENSOR_TYPE_PROXIMITY on this device.
[available]
accelerometersensor=True
gyroscopesensor=True
compasssensor=True
alssensor=True
orientationsensor=True
rotationsensor=True
stepcountersensor=True
proximitysensor=False
